[package]
name = "csgo-legacy-fixer"
version = "2.0.6"
edition = "2021"
rust-version = "1.76"
description = "CS:GO Legacy Fixer - Rust port"
license = "MIT"

[profile.release]
opt-level       = 3
lto             = "fat"
codegen-units   = 1
# panic = "abort" удалено: ломало catch_unwind в gui.rs::start_worker.
# См. комментарий в файле — при необходимости вернуть, надо править start_worker.
overflow-checks = true
strip           = true
debug           = false
incremental     = false

[profile.release.package."*"]
opt-level = 3

[dependencies]
anyhow = "1"
chrono = "0.4"
sha2 = "0.10"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }
ed25519-dalek = { version = "2", features = ["fast", "zeroize"] }
base64 = "0.22"
mimalloc = { version = "0.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

winreg = "0.52"
ureq = { version = "2", default-features = false, features = ["tls", "native-tls", "gzip"] }

eframe = "0.28"
rfd    = "0.15"

[build-dependencies]
winres = "0.1"

[dev-dependencies]
tempfile = "3"
