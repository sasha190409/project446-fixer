name: Build (Windows)

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build release EXE
    runs-on: windows-latest
    # Для ускорения можно попробовать windows-latest-8-cores (требует плана/организации)
    # runs-on: windows-latest-8-cores

    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld-link"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          variant: sccache

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      # Кэш target/ на Windows не используем: он раздувается и замедляет CI.
      # Если понадобится, можно добавить для не-Windows, но здесь только Windows.

      - name: Ensure lld-link is available
        shell: pwsh
        run: |
          $llvmPath = "C:\Program Files\LLVM\bin"

          if (Test-Path $llvmPath) {
            echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

          lld-link --version

      - name: Build release
        run: cargo build --release --verbose

      - name: sccache stats
        run: sccache --show-stats
        continue-on-error: true

      - name: Prepare artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $outPath = Join-Path $PWD "out"
          $stagePath = Join-Path $PWD "zip-root"
          $archivePath = Join-Path $PWD "archive"

          # Очистка/создание рабочих директорий
          Remove-Item $outPath -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $stagePath -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path $outPath | Out-Null
          New-Item -ItemType Directory -Force -Path $stagePath | Out-Null

          # Проверяем, что папка archive существует
          if (-not (Test-Path $archivePath -PathType Container)) {
            throw "Папка archive не найдена."
          }

          # ==========================================================
          # Основной EXE
          # ==========================================================

          $exeSource = Join-Path $PWD "target\release\csgo-legacy-fixer.exe"
          $exeTarget = Join-Path $stagePath ".super duper mega fixer 3000 gui.exe"

          if (-not (Test-Path $exeSource -PathType Leaf)) {
            throw "Файл $exeSource не найден."
          }

          Copy-Item $exeSource $exeTarget -Force

          # ==========================================================
          # PDB
          # ==========================================================

          $pdbSource = Join-Path $PWD "target\release\csgo-legacy-fixer.pdb"
          $pdbTarget = Join-Path $stagePath ".super duper mega fixer 3000 gui.pdb"

          if (Test-Path $pdbSource -PathType Leaf) {
            Copy-Item $pdbSource $pdbTarget -Force
          }

          # ==========================================================
          # Содержимое archive/
          #
          # В ZIP попадёт именно содержимое archive/, а не сама папка.
          # Например:
          #
          # archive/
          # ├── Hello.txt
          # └── data/
          #     └── test.txt
          #
          # станет:
          #
          # .super duper mega fixer 3000 gui.exe
          # .super duper mega fixer 3000 gui.pdb
          # Hello.txt
          # data/
          #   test.txt
          # ==========================================================

          Get-ChildItem -LiteralPath $archivePath -Force | ForEach-Object {
            Copy-Item `
              -LiteralPath $_.FullName `
              -Destination $stagePath `
              -Recurse `
              -Force
          }

          # ==========================================================
          # Создание ZIP
          # ==========================================================

          $zipPath = Join-Path $outPath "csgo-legacy-fixer.zip"

          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $zip = [System.IO.Compression.ZipFile]::Open(
            $zipPath,
            [System.IO.Compression.ZipArchiveMode]::Create
          )

          try {
            Get-ChildItem -LiteralPath $stagePath -Force -Recurse |
              Sort-Object FullName |
              ForEach-Object {

                $relativePath = $_.FullName.Substring($stagePath.Length).TrimStart('\', '/')
                $relativePath = $relativePath -replace '\\', '/'

                if ($_.PSIsContainer) {
                  # Сохраняем пустые директории тоже
                  $directoryEntry = $relativePath.TrimEnd('/') + '/'
                  $null = $zip.CreateEntry($directoryEntry)
                }
                else {
                  [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
                    $zip,
                    $_.FullName,
                    $relativePath,
                    [System.IO.Compression.CompressionLevel]::Optimal
                  )
                }
              }
          }
          finally {
            $zip.Dispose()
          }

          # ==========================================================
          # В out/ кладём ТОЛЬКО ZIP.
          # EXE и PDB остаются внутри архива и отдельно не публикуются.
          # ==========================================================

          # Показываем содержимое ZIP для проверки в логах
          Write-Host ""
          Write-Host "=== ZIP CONTENTS ==="

          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $checkZip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)

          try {
            foreach ($entry in $checkZip.Entries) {
              Write-Host $entry.FullName
            }
          }
          finally {
            $checkZip.Dispose()
          }

          Write-Host ""
          Write-Host "Создан архив: $zipPath"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: csgo-legacy-fixer-${{ github.sha }}
          path: out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  tag:
    name: Create version tag
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.get_version.outputs.tag }}
      created: ${{ steps.create_tag.outputs.created }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_WORKFLOW }}
          persist-credentials: true

      - name: Read version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(awk -F '"' '/^version[[:space:]]*=/ {print $2; exit}' Cargo.toml)

          if [ -z "$VERSION" ]; then
            echo "::error::Не удалось прочитать version из Cargo.toml"
            exit 1
          fi

          echo "Найдена версия: $VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.get_version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Тег ${{ steps.get_version.outputs.tag }} уже существует — пропускаем."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        id: create_tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag "${{ steps.get_version.outputs.tag }}"
          git push origin "${{ steps.get_version.outputs.tag }}"

          echo "created=true" >> "$GITHUB_OUTPUT"

  release:
    name: Attach to GitHub Release
    needs: [build, tag]
    if: |
      always()
      && needs.build.result == 'success'
      && (
        startsWith(github.ref, 'refs/tags/v')
        || needs.tag.outputs.created == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: csgo-legacy-fixer-${{ github.sha }}
          path: out

      - name: Determine release tag
        id: reltag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ needs.tag.outputs.tag }}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Релизный тег: $TAG"

      - name: Create release and upload files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.reltag.outputs.tag }}
          files: |
            out/csgo-legacy-fixer.zip
          generate_release_notes: true
          draft: false
          prerelease: false
