name: Build (Windows)

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build release EXE
    # Public repos: free 4-vCPU / 16 GB runner.
    # Do NOT use windows-latest-8-cores unless you accept per-minute billing.
    runs-on: windows-latest

    env:
      # x86-64-v3 = AVX2 baseline (~2013+). Do NOT use `native` in CI: the
      # produced EXE is distributed and would fault on older CPUs.
      #
      # This env var REPLACES .cargo/config.toml's [target.*] rustflags
      # — cargo does not merge them. Every flag the binary needs must be
      # listed here, including +crt-static. (The previous build's
      # `-C link-arg=-fuse-ld=lld-link` was both wrong — it's a clang
      # driver flag, not a linker flag — and omitted +crt-static, which
      # is why some users got "can't launch, missing DLL" reports.)
      RUSTFLAGS: >-
        -C debuginfo=0
        -C target-cpu=x86-64-v3
        -C target-feature=+crt-static

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Ensure lld-link is available
        shell: pwsh
        run: |
          if (-not (Get-Command lld-link -ErrorAction SilentlyContinue)) {
            echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          lld-link --version

      - name: Build release
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo build --release

      - name: sccache stats
        if: always()
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: sccache --show-stats
        continue-on-error: true

      # Единственное место, где формируется "раскладка для распространения":
      # переименованные exe/pdb + содержимое archive/. Один артефакт — его
      # скачивают и installer-job, и release-job. Никакого дублирования.
      - name: Stage files for distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path staged | Out-Null
          Copy-Item "target/release/csgo-legacy-fixer.exe" "staged/super duper mega fixer 3000 gui.exe"
          if (Test-Path "target/release/csgo-legacy-fixer.pdb") {
            Copy-Item "target/release/csgo-legacy-fixer.pdb" "staged/super duper mega fixer 3000 gui.pdb"
          }
          if (Test-Path archive) {
            Copy-Item -Recurse -Force "archive/*" staged/
          }
          Write-Host "=== staged ==="
          Get-ChildItem -Recurse staged | Select-Object FullName

      - name: Upload staged artifact
        uses: actions/upload-artifact@v4
        with:
          name: csgo-legacy-fixer-staged-${{ github.sha }}
          path: staged/
          if-no-files-found: error
          retention-days: 30

  tag:
    name: Create version tag
    needs: build
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.get_version.outputs.tag }}
      created: ${{ steps.create_tag.outputs.created }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_WORKFLOW }}
          persist-credentials: true

      - name: Read version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(awk -F '"' '/^version[[:space:]]*=/ {print $2; exit}' Cargo.toml)

          if [ -z "$VERSION" ]; then
            echo "::error::Не удалось прочитать version из Cargo.toml"
            exit 1
          fi

          echo "Найдена версия: $VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.get_version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Тег ${{ steps.get_version.outputs.tag }} уже существует — пропускаем."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        id: create_tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag "${{ steps.get_version.outputs.tag }}"
          git push origin "${{ steps.get_version.outputs.tag }}"

          echo "created=true" >> "$GITHUB_OUTPUT"

  installer:
    name: Build Windows installer (Inno Setup)
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download staged artifact
        uses: actions/download-artifact@v4
        with:
          name: csgo-legacy-fixer-staged-${{ github.sha }}
          path: staged

      - name: Read version from Cargo.toml
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path Cargo.toml -Pattern '^\s*version\s*=\s*"([^"]+)"' |
               Select-Object -First 1
          if (-not $m) { Write-Error "version not found in Cargo.toml"; exit 1 }
          "version=$($m.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      # ISCC.exe предустановлен на windows-latest (Inno Setup 6).
      - name: Compile installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "installer\setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem installer\out

      - name: Hash installer (SHA256)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem "installer/out/csgo-legacy-fixer-setup-*.exe" | Select-Object -First 1
          if (-not $exe) { throw "installer exe not found" }
          $h = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLower()
          "$h  $($exe.Name)" | Out-File -Encoding utf8NoBOM "installer/out/sha256sums-installer.txt"
          Get-Content "installer/out/sha256sums-installer.txt"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: csgo-legacy-fixer-installer-${{ github.sha }}
          path: |
            installer/out/csgo-legacy-fixer-setup-*.exe
            installer/out/sha256sums-installer.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Package and attach to GitHub Release
    needs: [build, tag, installer]
    if: |
      always()
      && needs.build.result == 'success'
      && needs.installer.result == 'success'
      && (
        startsWith(github.ref, 'refs/tags/v')
        || needs.tag.outputs.created == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download staged artifact
        uses: actions/download-artifact@v4
        with:
          name: csgo-legacy-fixer-staged-${{ github.sha }}
          path: staged

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: csgo-legacy-fixer-installer-${{ github.sha }}
          path: installer-out

      # Всё уже подготовлено в build-job'е (staged/): просто хэшируем и упаковываем.
      # Никакого "rename exe → dist name" тут больше нет — это делается один раз.
      - name: Prepare release package (zip)
        shell: bash
        run: |
          set -euo pipefail
          OUT="out"
          mkdir -p "$OUT"

          # sha256sums.txt внутри zip — только хэши содержимого zip.
          # Исключаем сам файл; пишем UTF-8 без BOM (дефолт Linux).
          (cd staged && find . -type f ! -name 'sha256sums.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's| \./| |' > sha256sums.txt)

          echo ""
          echo "=== staged/sha256sums.txt ==="
          cat staged/sha256sums.txt

          ZIP="$OUT/csgo-legacy-fixer.zip"
          ZIP_ABS="$(pwd)/$ZIP"
          rm -f "$ZIP_ABS"
          (cd staged && find . -type f -printf '%P\n' | sort | zip -X -9 -@ "$ZIP_ABS")

          echo ""
          echo "=== ZIP CONTENTS ==="
          unzip -l "$ZIP"

      # Релизный sha256sums.txt = хэши содержимого zip + хэш установщика.
      # Файл, лежащий внутри zip, остаётся только про содержимое zip.
      - name: Build release-level sha256sums.txt
        shell: bash
        run: |
          set -euo pipefail
          unzip -j out/csgo-legacy-fixer.zip sha256sums.txt -d out/
          cat installer-out/sha256sums-installer.txt >> out/sha256sums.txt

          echo ""
          echo "=== out/sha256sums.txt (release-level) ==="
          cat out/sha256sums.txt

      - name: Determine release tag
        id: reltag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ needs.tag.outputs.tag }}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Релизный тег: $TAG"

      - name: Generate release notes with checksums
        id: notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.reltag.outputs.tag }}"

          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="${GITHUB_SHA}" \
            --jq '.body' > release_body.md

          if [ -f out/sha256sums.txt ]; then
            echo -e "\n\n<details><summary>SHA256 Checksums</summary>\n\n\`\`\`\n$(cat out/sha256sums.txt)\n\`\`\`\n\n</details>" >> release_body.md
          fi

      - name: Create release and upload files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.reltag.outputs.tag }}
          body_path: release_body.md
          files: |
            out/csgo-legacy-fixer.zip
            out/sha256sums.txt
            installer-out/csgo-legacy-fixer-setup-*.exe
          draft: false
          prerelease: false
