[package]
name = "csgo-legacy-fixer"
version = "4.0.8"
edition = "2024"
rust-version = "1.95"
description = "CS:GO Legacy Fixer - Rust port"
license = "MIT"

# Release is tuned for build speed, not binary size — we're well under
# GitHub's 2 GB per-file limit either way. Dropping thin LTO and bumping
# codegen-units to 16 is roughly a 2–4× wall-clock win on CI and costs
# nothing at runtime for an IO-bound GUI fixer.
[profile.release]
opt-level       = 3
lto             = false
codegen-units   = 16
overflow-checks = false
strip           = true
debug           = false
incremental     = false

[profile.release.package."*"]
opt-level = 3

# For local iteration when you don't even want opt-level=3.
[profile.release-fast]
inherits        = "release"
lto             = false
codegen-units   = 16
opt-level       = 2
overflow-checks = false
strip           = false
incremental     = true

[profile.release-fast.package."*"]
opt-level = 2

[dependencies]
anyhow = "1"

# Only `Local::now()` + `.format(...)` are used — drop `oldtime` and
# `wasmbind`, keep `clock` (Local) and `std` (alloc for the formatted str).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

sha2 = "0.11"
tracing = "0.1"
tracing-appender = "0.2"

# `ansi` must stay: i18n.rs calls `.with_ansi(false)`, and that method is
# feature-gated behind `ansi` in tracing-subscriber.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }

ed25519-dalek = { version = "3", features = ["fast", "zeroize"] }
base64 = "0.23"
mimalloc = { version = "0.1", default-features = false }
memmap2 = "0.9"

[target.'cfg(windows)'.dependencies]
# Win32_System_Com dropped — nothing in the tree imports it.
#
# Win32_System_Registry MUST stay: windows 0.62 gates ShellExecuteExW and
# SHELLEXECUTEINFOW (used by win/elevate.rs) behind this feature, even
# though they live in Win32::UI::Shell. The name is not a reliable guide
# to what's behind it in this crate.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

winreg = "0.56"

# rustls/ring removed: on Windows use platform TLS (Schannel via native-tls).
# ring/aws-lc-rs compile C + asm and are the slowest pieces of the dependency
# graph. Only used in fixer/update.rs for plain GETs over HTTPS.
ureq = { version = "3", default-features = false, features = ["gzip", "native-tls"] }

# If the build complains about a missing winit feature, revert just this
# line to the old `eframe = { version = "0.36", features = ["glow"] }`.
# `glow` = renderer, `default_fonts` = the ProggyClean bundle egui needs.
# Dropping the other defaults (accesskit, x11, wayland, web_screen_reader)
# is a no-op on Windows except for accesskit.
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }

rfd    = "0.17"

[build-dependencies]
winres = "0.1"

[dev-dependencies]
tempfile = "3"
