[package]
name = "csgo-legacy-fixer"
version = "4.0.0"
edition = "2024"
rust-version = "1.95"
description = "CS:GO Legacy Fixer - Rust port"
license = "MIT"

# --------------------------------------------------------------------------- 
# Shipped / release profile.
#
# CHANGED from fat LTO + codegen-units=1 -> thin LTO + codegen-units=8.
# Fat LTO serializes the whole crate graph at link time and dominated CI wall
# time on the 4-vCPU GitHub runner. "thin" keeps ~all the runtime perf for a
# fraction of the link cost.
#
# overflow-checks also flipped to false: it disables a lot of codegen
# optimizations. Re-enable only if you actually rely on panic-on-overflow.
# ---------------------------------------------------------------------------
[profile.release]
opt-level       = 3
lto             = "thin"
codegen-units   = 8
# panic = "abort" удалено: ломало catch_unwind в gui.rs::start_worker.
# См. комментарий в файле — при необходимости вернуть, надо править start_worker.
overflow-checks = false
strip           = true
debug           = false
incremental     = false

[profile.release.package."*"]
opt-level = 3

# ---------------------------------------------------------------------------
# NEW: local dev profile.
#
# build.bat already passes `--profile release-fast` when FAST=1, but the
# profile was never defined here, so FAST=1 did not do what it claimed.
# This profile optimizes for rebuild speed, not binary quality.
# ---------------------------------------------------------------------------
[profile.release-fast]
inherits        = "release"
lto             = false
codegen-units   = 16
opt-level       = 2
overflow-checks = false
strip           = false
incremental     = true

[profile.release-fast.package."*"]
opt-level = 2

[dependencies]
anyhow = "1"
chrono = "0.4"
sha2 = "0.11"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }
ed25519-dalek = { version = "3", features = ["fast", "zeroize"] }
base64 = "0.23"
mimalloc = { version = "0.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

winreg = "0.56"
ureq = { version = "3", default-features = true, features = ["gzip"] }

eframe = { version = "0.36", features = ["glow"] }
rfd    = "0.17"

[build-dependencies]
winres = "0.1"

[dev-dependencies]
tempfile = "3"
