name: Build (Windows)

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build release EXE
    # Public repos: free 4-vCPU / 16 GB runner.
    # Do NOT use windows-latest-8-cores unless you accept per-minute billing.
    runs-on: windows-latest

    env:
      # x86-64-v3 = AVX2 baseline (~2013+). Do NOT use `native` in CI: the
      # produced EXE is distributed and would fault on older CPUs.
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld-link -C target-cpu=x86-64-v3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Registry + git deps + target/ cache. sccache below handles the
      # per-crate compile cache across runs; rust-cache handles the target/
      # tree. They overlap slightly but are complementary.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release
          cache-on-failure: true
          workspaces: ". -> target"

      # NEW: sccache wired to the GitHub Actions cache backend so it
      # persists across CI runs. Without this, `sccache --show-stats`
      # below is meaningless (nothing was ever populated).
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Ensure lld-link is available
        shell: pwsh
        run: |
          if (-not (Get-Command lld-link -ErrorAction SilentlyContinue)) {
            echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          lld-link --version

      - name: Build release
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo build --release

      - name: sccache stats
        if: always()
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: sccache --show-stats
        continue-on-error: true

      # Upload the raw artifacts; packaging happens in the release job (Linux).
      - name: Upload raw artifacts
        uses: actions/upload-artifact@v4
        with:
          name: csgo-legacy-fixer-raw-${{ github.sha }}
          path: |
            target/release/csgo-legacy-fixer.exe
            target/release/csgo-legacy-fixer.pdb
          if-no-files-found: error
          retention-days: 30

  tag:
    name: Create version tag
    needs: build
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.get_version.outputs.tag }}
      created: ${{ steps.create_tag.outputs.created }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_WORKFLOW }}
          persist-credentials: true

      - name: Read version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(awk -F '"' '/^version[[:space:]]*=/ {print $2; exit}' Cargo.toml)

          if [ -z "$VERSION" ]; then
            echo "::error::Не удалось прочитать version из Cargo.toml"
            exit 1
          fi

          echo "Найдена версия: $VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.get_version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Тег ${{ steps.get_version.outputs.tag }} уже существует — пропускаем."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        id: create_tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag "${{ steps.get_version.outputs.tag }}"
          git push origin "${{ steps.get_version.outputs.tag }}"

          echo "created=true" >> "$GITHUB_OUTPUT"

  release:
    name: Package and attach to GitHub Release
    needs: [build, tag]
    if: |
      always()
      && needs.build.result == 'success'
      && (
        startsWith(github.ref, 'refs/tags/v')
        || needs.tag.outputs.created == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download raw artifacts
        uses: actions/download-artifact@v4
        with:
          name: csgo-legacy-fixer-raw-${{ github.sha }}
          path: raw

      # All packaging runs on Linux: faster zip, faster SHA256, cheaper runner.
      - name: Prepare release package
        shell: bash
        run: |
          set -euo pipefail

          STAGE="zip-root"
          OUT="out"
          mkdir -p "$OUT" "$STAGE"

          # Rename the main EXE and PDB to the distribution names.
          cp raw/csgo-legacy-fixer.exe "$STAGE/.super duper mega fixer 3000 gui.exe"
          if [[ -f raw/csgo-legacy-fixer.pdb ]]; then
            cp raw/csgo-legacy-fixer.pdb "$STAGE/.super duper mega fixer 3000 gui.pdb"
          fi

          # Copy contents of archive/ if it exists in the repo.
          if [[ -d archive ]]; then
            cp -R archive/. "$STAGE/"
          fi

          # Generate sha256sums.txt (64 lowercase hex, two spaces, forward slashes).
          # Exclude the sums file itself. Write UTF-8 without BOM (default on Linux).
          SUMS="$STAGE/sha256sums.txt"
          (cd "$STAGE" && find . -type f ! -name 'sha256sums.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's| \./| |' > sha256sums.txt)

          echo ""
          echo "=== sha256sums.txt ==="
          cat "$SUMS"

          # Create the ZIP with deterministic ordering.
          ZIP="$OUT/csgo-legacy-fixer.zip"
          rm -f "$ZIP"
          (cd "$STAGE" && find . -type d -print0 | sort -z | xargs -0 -I{} mkdir -p "$ZIP.tmp"; \
           cd "$STAGE" && find . -type f -print0 | sort -z | xargs -0 zip -X -9 "$ZIP")

          echo ""
          echo "=== ZIP CONTENTS ==="
          unzip -l "$ZIP"

          echo ""
          echo "Создан архив: $ZIP"

      - name: Extract sha256sums.txt for release body
        run: |
          unzip -j out/csgo-legacy-fixer.zip sha256sums.txt -d out/

      - name: Determine release tag
        id: reltag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ needs.tag.outputs.tag }}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Релизный тег: $TAG"

      - name: Generate release notes with checksums
        id: notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.reltag.outputs.tag }}"

          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="${GITHUB_SHA}" \
            --jq '.body' > release_body.md

          if [ -f out/sha256sums.txt ]; then
            echo -e "\n\n<details><summary>SHA256 Checksums</summary>\n\n\`\`\`\n$(cat out/sha256sums.txt)\n\`\`\`\n\n</details>" >> release_body.md
          fi

      - name: Create release and upload files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.reltag.outputs.tag }}
          body_path: release_body.md
          files: |
            out/csgo-legacy-fixer.zip
            out/sha256sums.txt
          draft: false
          prerelease: false
